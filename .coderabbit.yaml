# CodeRabbit settings for FoundryVTT-quest-log.
# Shared rules come from the central dxcufgb/coderabbit repository (inheritance: true), and CodeRabbit reads
# the README as code guidelines. Only what is specific to this repository is here.
# Paths here must not repeat a central path (scripts/**/*.js, .github/workflows/**, **/*.sh, **/*.ps1, **/*.iss,
# module.json, **/*.md): an entry with the same path replaces the central one instead of adding to it.
# Check the merged result on a pull request with: @coderabbitai configuration
inheritance: true

reviews:
  path_instructions:
    - path: "scripts/**"
      instructions: |
        Quests live in the flags of two module-created journal entries (shared: default OWNER, secret: GM only).
        Every write must be a dot-path update of a single quest/objective/note/image key (never a whole-object
        replace of the quest map), so concurrent edits by several players don't overwrite each other.
        Hidden quests must never be written to the shared store. User text is stored as plain text and rendered
        through escapeHTML before enrichHTML; flag any interpolation of user text into HTML without escaping.
        Image uploads from players without the upload permission are relayed to the active GM only.
    - path: "templates/**"
      instructions: |
        Triple-stash ({{{ }}}) is only allowed for HTML built by enrich() or search highlight(), which escape first.
    - path: ".github/workflows/{ci,release}.yml"
      instructions: |
        Thin callers of dxcufgb/foundry-module-ci, identical in every Foundry module repository. Flag any change
        here that is not the same change in all modules (it belongs in foundry-module-ci instead), except the
        pinned SHA of foundry-module-ci itself.
