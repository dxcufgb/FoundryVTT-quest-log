name: Bug report
description: Something in the module isn't working as it should.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more detail you give, the faster it can be fixed.

  - type: input
    id: foundry-version
    attributes:
      label: Foundry VTT version
      description: Shown in the bottom-left of the Setup screen, or under Settings → General in a world.
      placeholder: e.g. 13.348
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Where were you running Foundry when the bug happened?
      options:
        - Chrome
        - Firefox
        - Edge
        - Safari
        - Opera
        - Brave
        - Foundry desktop app
        - Other (please say which in the version field)
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser version
      description: |
        Usually found under Help → About in the browser's menu. If you used the Foundry desktop app, write "desktop app".
      placeholder: e.g. Chrome 131.0.6778.86
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exactly what you did, step by step, so the bug can be seen again.
      placeholder: |
        1. Enable the module
        2. Click on ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: Module version
      description: Found in Manage Modules.
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Game system and version
      placeholder: e.g. dnd5e 5.1.0

  - type: textarea
    id: modules
    attributes:
      label: Other active modules
      description: Does it still happen with only this module active? (Find the Culprit helps.)

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Press F12, open the Console tab and paste any red errors. Often the key clue.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images or videos in here.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the existing issues and this hasn't been reported yet.
          required: true
